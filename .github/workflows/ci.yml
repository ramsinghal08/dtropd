name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel first; requirements.txt then sees torch>=2.0 satisfied and
          # will not pull the much larger default (CUDA) build over it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Install from requirements.txt rather than a hand-written list. The
          # list had drifted: it omitted matplotlib, so the only test of SPEC
          # Sec. 7's "every figure regenerable by one command" -- Phase 6's E3
          # criterion -- skipped silently on every CI run.
          pip install -r requirements.txt

      - name: CLI smoke
        run: |
          python run.py --help
          python run.py validate --config experiments/configs/smoke.yaml

      - name: pytest
        run: pytest -q
