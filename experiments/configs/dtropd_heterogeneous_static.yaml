  calibration_tail_quantile: 0.95
  calibration_target_w: 0.5
  radius_reference: fixed
  radius_reference_window: 10
  kl_direction: reverse
  radius_signal: nonstationarity
  trust_batch: own
  aggregation: sum
  neighbor_selection: all
  top_k: null
  trimmed_mean_fraction: 0.2
  krum_byzantine: 1
graph:
  topology: complete
  degree: 4
  seed: null
train:
  algo: dtropd
  total_epochs: 200
  num_envs: 40
  steps_per_env: null
  seed: 0
  device: cpu
  torch_threads: 1
  log_dir: runs/dtropd_heterogeneous
  run_name: null
  eval_interval: 25
  eval_episodes: 16
  eval_deterministic: true
  checkpoint_interval: 0
  log_interval: 1
notes: 'D-TrOPD / heterogeneous / H7 headline arm | calibrated per SPEC Sec. 10 /
