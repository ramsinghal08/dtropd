  n_targets: 3
  capture_group_size: 3
  capture_radius: 0.3
  max_cycles: 50
  reward_spec_version: v1
  shaping_weight: 1.0
  capture_bonus: 1.0
  collision_penalty: 0.1
  local_ratio: 0.5
  sensor_range: 1.5
  masked_sensor_range: 0.5
  heterogeneous: true
  friction_velocity_scale: 0.5
  friction_zones:
  - x: -0.6
    y: 0.0
    radius: 0.7
  mask_zones:
  - x: 0.6
    y: 0.0
    radius: 0.7
  dt: 0.1
  damping: 0.25
  contact_force: 100.0
  contact_margin: 0.001
  agent_size: 0.05
  target_size: 0.05
  accel: 5.0
  max_speed: null
  spawn_range: 1.0
network:
  hidden_sizes:
  - 64
  - 64
  activation: tanh
  log_std_init: -0.5
  log_std_min: -5.0
  log_std_max: 2.0
  state_dependent_std: false
  orthogonal_init: true
ppo:
  lr: 0.001
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  inner_epochs: 4
  num_minibatches: 4
  kl_early_stop: 0.02
  normalize_advantages: true
  normalize_returns: true
  clip_value_loss: false
  value_clip_ratio: 0.2
distill:
  enabled: true
  beta_max: 0.05
  warmup_fraction: 0.1
