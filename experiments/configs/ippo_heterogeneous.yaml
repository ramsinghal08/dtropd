# IPPO on the heterogeneous environment: a high-friction zone (velocity scaled
# to 50%) and a masked-observation zone (sensor range 1.5 -> 0.5).
#
# This is the H7 IPPO arm; the D-TrOPD arm lands in .
notes: "IPPO / heterogeneous / H7 baseline arm"

env:
  n_agents: 12
  n_targets: 3
  capture_group_size: 3
  capture_radius: 0.3
  max_cycles: 50
  heterogeneous: true
  sensor_range: 1.5
  masked_sensor_range: 0.5
  friction_velocity_scale: 0.5
  friction_zones:
    - {x: -0.6, y: 0.0, radius: 0.7}
  mask_zones:
    - {x: 0.6, y: 0.0, radius: 0.7}

network:
  hidden_sizes: [64, 64]

ppo:
  lr: 1.0e-3
  inner_epochs: 4
  num_minibatches: 4
  kl_early_stop: 0.02

distill:
  enabled: false
  kappa: 100.0

graph:
  topology: complete

train:
  algo: ippo
  total_epochs: 150
  num_envs: 40
  seed: 0
  device: cpu
  eval_interval: 25
  eval_episodes: 16
  log_dir: runs/ippo_heterogeneous
