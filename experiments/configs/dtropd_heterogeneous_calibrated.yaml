# D-TrOPD with the attenuation calibrated to the *measured* D_ij distribution.
#
# At the shipped defaults (delta_base=0.1, gamma=1.0) the observed social
# divergences on this environment are D_ij ~ 0.026 (median over 1056 edges),
# which puts every edge deep inside the radius: mean w_ij = 0.987, i.e. the
# trust gate is inert and the algorithm is behaviourally NaiveDistill.
#
# The values below come from experiments/calibrate_delta.py: delta_base is the
# median observed D_ij, and gamma attenuates a 95th-percentile edge to w = 0.5.
# Re-run the calibration if the environment or the network changes.
notes: "D-TrOPD / heterogeneous / calibrated attenuation"

env:
  n_agents: 12
  n_targets: 3
  capture_group_size: 3
  capture_radius: 0.3
  max_cycles: 50
  heterogeneous: true
  sensor_range: 1.5
  masked_sensor_range: 0.5
  friction_velocity_scale: 0.5
  local_ratio: 0.5
  friction_zones:
    - {x: -0.6, y: 0.0, radius: 0.7}
  mask_zones:
    - {x: 0.6, y: 0.0, radius: 0.7}

network:
  hidden_sizes: [64, 64]

ppo:
  lr: 1.0e-3
  inner_epochs: 4
  num_minibatches: 4
  kl_early_stop: 0.02        # eta -- the improvement trust region

distill:
  enabled: true
  beta_max: 0.05
  warmup_fraction: 0.1       # invariant I8
  kappa: 100.0               # kappa * eta = 2.0, mid-band of SPEC Sec. 2.2
  delta_base: 0.026
  gamma_attenuation: 26.0
  attenuation: continuous
  kl_direction: reverse      # invariant I2 -- the only legal value
  radius_signal: nonstationarity   # invariant I1
  trust_batch: own           # invariant I3
  aggregation: sum           # robust operators are the Phase 7 arms
  neighbor_selection: all    # SPEC Sec. 2.3: the weights do the filtering

graph:
  topology: complete

train:
  algo: dtropd
  total_epochs: 150
  num_envs: 40
  seed: 0
  device: cpu
  eval_interval: 25
  eval_episodes: 16
  log_dir: runs/dtropd_heterogeneous_calibrated
