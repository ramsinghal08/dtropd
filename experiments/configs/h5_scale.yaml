# H5 -- size-independence under locality, scale arm (SPEC Sec. 6, ).
#
#   "Measure: same gap per capita with fixed-degree topology. Confirmed if the
#    per-capita gap is flat in N."
#
# KEEPS N=48, per SPEC Sec. 13 / D15. H5's topology is fixed-degree -- O(N*d)
# edges, so N=48 costs roughly twice N=24 rather than four times -- and its
# prediction is FLATNESS in N, which the largest affordable N tests hardest.
# Dropping the top point would remove the measurement that discriminates most.
#
# If N=48 does not fit the execution environment, D15 requires the MEASURED
# LIMIT to be reported -- the largest N that completed, with its wall-clock --
# rather than the point being silently dropped. A scale sweep that quietly
# stops early reads as a completed sweep.
#
# This file is the per-capita GAP arm. The Assumption-2 decay probe lives in
# h5_locality.yaml, which is cross-version and separately labelled; the two are
# kept apart because only that one invokes the D13 exception.
#
# degree 4 at every N is what "fixed-degree" means here: the neighbourhood size
# is held constant so that per-capita flatness is a statement about N alone and
# not about how much each agent is coupled to.
name: h5_scale
notes: >-
  H5 per-capita simultaneity gap vs N, fixed-degree (degree 4). N in
  {4,8,12,24,48} -- N=48 retained per D15. Environment-property measurement.
out_dir: runs/h5_scale
seeds: [0, 1, 2, 3, 4]
auto_calibrate: true

base:
  env:
    n_agents: 12
    n_targets: 3
    capture_group_size: 3
    max_cycles: 50
    heterogeneous: false
    local_ratio: 0.5
    reward_spec_version: v1
  network:
    hidden_sizes: [64, 64]
  ppo:
    lr: 1.0e-3
    inner_epochs: 4
    num_minibatches: 4
  distill:
    enabled: true
    beta_max: 0.05
    warmup_fraction: 0.1
    kappa: 100.0
    delta_base: 0.1
    calibration: warmup
    calibration_epochs: 8
    calibration_pool_epochs: 2
  instrument:
    surrogate_gain: true
    per_edge_gradients: false
    decay_probe: false
  graph:
    topology: fixed_degree
    degree: 4
  train:
    algo: dtropd
    total_epochs: 60
    num_envs: 20
    device: cpu
    eval_interval: 30
    eval_episodes: 16

arms:
  # degree 4 needs degree * n_agents even, which holds for every N below.
  - {name: n04, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 4, env.n_targets: 1, env.capture_group_size: 2, graph.degree: 2}}
  - {name: n08, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 8, env.n_targets: 2, env.capture_group_size: 3}}
  - {name: n12, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 12, env.n_targets: 3, env.capture_group_size: 3}}
  - {name: n24, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 24, env.n_targets: 6, env.capture_group_size: 3}}
  - {name: n48, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 48, env.n_targets: 12, env.capture_group_size: 3}}
