# H3 -- trust-radius pathologies (SPEC Sec. 6).
#
# PRE-REGISTERED DECISION RULE (SPEC Sec. 6, H3):
#   "Measure: delta_i under (a) an intentionally DEGENERATE CRITIC and (b) a
#    10x REWARD RESCALE, for BOTH radius definitions.  CONFIRMED IF the
#    nonstationarity radius is SCALE-INVARIANT and CONTRACTS under instability,
#    while value-variance shows the predicted pathologies."
#
# DECIDING QUANTITIES -- two, and both must hold:
#   (1) SCALE INVARIANCE.  delta_mean under 10x reward vs 1x, same radius
#       signal. The 10x arms are their OWN condition because they are a
#       different environment -- seeds pair within a condition, and comparing
#       across environments is the measurement, not a paired contrast.  nonstationarity: ratio ~ 1.0.
#       value_variance: ratio far from 1 (value variance scales with reward^2).
#   (2) CONTRACTION UNDER INSTABILITY.  delta_mean with a degenerate critic vs
#       a healthy one.  nonstationarity: delta CONTRACTS (ratio < 1) because a
#       destabilised policy has larger Delta_i and delta = delta_base*exp(-k*D).
#       value_variance: delta GROWS or stays high -- the sign pathology I1
#       exists to prevent, where a critic that explains nothing earns maximal
#       trust.
#
# The degenerate critic is produced with ppo.value_coef = 0: the critic is never
# the critic at its random initialisation. It is loud-but-legal: it contradicts I4
# and warns so, and exists only for this arm -- because H3 predicts what happens
# when the value signal is MEANINGLESS, not merely noisy. value_coef stays > 0.
#
# INVARIANT I1 IS NOT RELAXED. radius_signal='value_variance' emits a loud
# config warning and exists ONLY as this ablation. Nothing from those arms may
# be reported as D-TrOPD -- they are the counterexample, not the method.
name: h3_radius
notes: >-
  H3 radius pathologies. {nonstationarity, value_variance} x {healthy, degenerate
  critic, 10x reward}. value_variance arms are the I1 counterexample, never
  D-TrOPD results.
out_dir: runs/h3_radius
seeds: [0, 1, 2, 3, 4]
auto_calibrate: true

base:
  env: {n_agents: 12, n_targets: 3, capture_group_size: 3, max_cycles: 50,
        heterogeneous: true, local_ratio: 0.5, reward_spec_version: v1}
  network: {hidden_sizes: [64, 64]}
  ppo: {lr: 1.0e-3, inner_epochs: 4, num_minibatches: 4, kl_early_stop: 0.02,
        value_coef: 0.5}
  distill:
    enabled: true
    beta_max: 0.05
    warmup_fraction: 0.1
    kappa: 100.0
    calibration: warmup
    calibration_epochs: 8
    calibration_pool_epochs: 2
  instrument:
    per_edge_gradients: true
    per_edge_gradient_interval: 5
    consensus_pull: true
    decay_probe: false
  graph: {topology: complete}
  train: {algo: dtropd, total_epochs: 60, num_envs: 20, device: cpu,
          eval_interval: 30, eval_episodes: 16}

arms:
  # --- nonstationarity radius (the method; I1-compliant) -------------------
  - {name: nonstat_healthy,    algo: dtropd, condition: nonstationarity,
     overrides: {distill.radius_signal: nonstationarity}}
  - {name: nonstat_degenerate, algo: dtropd, condition: nonstationarity,
     overrides: {distill.radius_signal: nonstationarity, ppo.degenerate_critic: true}}
  - {name: nonstat_reward10x,  algo: dtropd, condition: nonstationarity_10x,
     overrides: {distill.radius_signal: nonstationarity, env.shaping_weight: 10.0,
                 env.capture_bonus: 10.0, env.collision_penalty: 1.0}}
  # --- value-variance radius (the I1 counterexample; NEVER reported as D-TrOPD)
  - {name: valvar_healthy,     algo: dtropd, condition: value_variance,
     overrides: {distill.radius_signal: value_variance}}
  - {name: valvar_degenerate,  algo: dtropd, condition: value_variance,
     overrides: {distill.radius_signal: value_variance, ppo.degenerate_critic: true}}
  - {name: valvar_reward10x,   algo: dtropd, condition: value_variance_10x,
     overrides: {distill.radius_signal: value_variance, env.shaping_weight: 10.0,
                 env.capture_bonus: 10.0, env.collision_penalty: 1.0}}
