# H4 -- the simultaneity penalty grows with N (SPEC Sec. 6, ).
#
#   "Measure: per-round `surrogate - realized improvement` across the scale
#    sweep, densely coupled topology. Confirmed if roughly linear in N."
#
# CAPPED AT N=24, per SPEC Sec. 13 / D15. H4's topology is densely coupled --
# a complete graph, O(N^2) edges -- and its prediction is a SLOPE. A slope is
# identifiable from {4, 8, 12, 24}; N=48 would cost roughly four times N=24 to
# add one more point to a line. H5 keeps N=48 because its prediction is
# FLATNESS, which a larger N tests hardest, and its fixed-degree topology makes
# it affordable. The asymmetry is deliberate and is the reason it exists.
#
# These are environment-property measurements: the subject is how the
# simultaneity gap scales with N, not which algorithm wins. Every arm is the
# same algorithm at a different N, so nothing here is an algorithm comparison.
#
# Reward spec: v1 throughout. Single version, so D13 is satisfied trivially.
name: h4_scale
notes: >-
  H4 simultaneity penalty vs N, densely coupled. N in {4,8,12,24} -- capped per
  D15 because dense coupling is O(N^2) and the prediction is a slope.
  Environment-property measurement, not an algorithm comparison.
out_dir: runs/h4_scale
seeds: [0, 1, 2, 3, 4]
auto_calibrate: true

base:
  env:
    n_agents: 12
    n_targets: 3
    capture_group_size: 3
    max_cycles: 50
    heterogeneous: false
    local_ratio: 0.5
    reward_spec_version: v1
  network:
    hidden_sizes: [64, 64]
  ppo:
    lr: 1.0e-3
    inner_epochs: 4
    num_minibatches: 4
  distill:
    enabled: true
    beta_max: 0.05
    warmup_fraction: 0.1
    kappa: 100.0
    delta_base: 0.1
    calibration: warmup
    calibration_epochs: 8
    calibration_pool_epochs: 2
  instrument:
    surrogate_gain: true      # H4's measurement
    per_edge_gradients: false # H1's, and O(N^2) here
    decay_probe: false        # H5's
  graph:
    topology: complete        # "densely coupled", as H4 specifies
  train:
    algo: dtropd
    total_epochs: 60
    num_envs: 20
    device: cpu
    eval_interval: 30
    eval_episodes: 16

arms:
  - {name: n04, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 4, env.n_targets: 1, env.capture_group_size: 2}}
  - {name: n08, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 8, env.n_targets: 2, env.capture_group_size: 3}}
  - {name: n12, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 12, env.n_targets: 3, env.capture_group_size: 3}}
  - {name: n24, algo: dtropd, condition: scale, purpose: environment_property,
     overrides: {env.n_agents: 24, env.n_targets: 6, env.capture_group_size: 3}}
