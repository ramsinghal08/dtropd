# D-TrOPD on the homogeneous environment (sanity arm; zones disabled).
# Paired with experiments/configs/ippo_heterogeneous.yaml: identical env,
# identical PPO hyperparameters, identical seeds. The only difference is the
# social path.
notes: "D-TrOPD / homogeneous / paired with ippo_homogeneous"

env:
  n_agents: 12
  n_targets: 3
  capture_group_size: 3
  capture_radius: 0.3
  max_cycles: 50
  heterogeneous: false
  sensor_range: 1.5
  masked_sensor_range: 0.5
  friction_velocity_scale: 0.5
  local_ratio: 0.5
  friction_zones:
    - {x: -0.6, y: 0.0, radius: 0.7}
  mask_zones:
    - {x: 0.6, y: 0.0, radius: 0.7}

network:
  hidden_sizes: [64, 64]

ppo:
  lr: 1.0e-3
  inner_epochs: 4
  num_minibatches: 4
  kl_early_stop: 0.02        # eta -- the improvement trust region

distill:
  enabled: true
  beta_max: 0.05
  warmup_fraction: 0.1       # invariant I8
  kappa: 100.0               # kappa * eta = 2.0, mid-band of SPEC Sec. 2.2
  delta_base: 0.1
  gamma_attenuation: 1.0
  attenuation: continuous
  # SPEC Sec. 10 / D1: this is a HEADLINE arm, so the attenuation is calibrated
  # rather than guessed. beta is held at 0 for the calibration window and the
  # warmup ramp starts after it, so the measurement is taken with the gate off.
  calibration: warmup
  calibration_quantile: 0.5
  calibration_tail_quantile: 0.95
  calibration_target_w: 0.5
  radius_reference: fixed      # SPEC Sec. 10 / D5: running_quantile is an ablation
  kl_direction: reverse      # invariant I2 -- the only legal value
  radius_signal: nonstationarity   # invariant I1
  trust_batch: own           # invariant I3
  aggregation: sum           # robust operators are the arms
  neighbor_selection: all    # SPEC Sec. 2.3: the weights do the filtering

graph:
  topology: complete

train:
  algo: dtropd
  total_epochs: 150
  num_envs: 40
  seed: 0
  device: cpu
  eval_interval: 25
  eval_episodes: 16
  log_dir: runs/dtropd_homogeneous
