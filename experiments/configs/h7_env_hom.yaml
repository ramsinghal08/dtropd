# The H7 CONTROL environment as a standalone config, so the D7 sensitivity
# grid can be derived on the environment H7 will actually run on.
#
# SPEC Sec. 12 / D7-AMENDED: the grid is a PROCEDURE, not three literal
# numbers. The numbers in the original D7 came from 6/8/10-epoch windows on an
# environment configuration that has since changed, so they must be re-derived
# here rather than reused. SPEC Sec. 13 / D14 makes deriving and confirming
# this grid a precondition for running H7 at all.
#
# Every field below mirrors h7.yaml's `base` for the heterogeneous arms. It has
# to: a grid derived on a different environment would be measuring a different
# distribution of D_ij and would silently mis-set the trust gate.
notes: >-
  H7 homogeneous (control) environment, for the D7 calibration grid only.
  Not a training config -- no arms, no seeds.
env:
  n_agents: 12
  n_targets: 3
  capture_group_size: 3
  capture_radius: 0.3
  max_cycles: 50
  heterogeneous: false
  local_ratio: 0.5
  reward_spec_version: v1
network:
  hidden_sizes: [64, 64]
ppo:
  lr: 1.0e-3
  inner_epochs: 4
  num_minibatches: 4
  kl_early_stop: 0.02
distill:
  enabled: true
  beta_max: 0.05
  warmup_fraction: 0.1
  kappa: 100.0
  delta_base: 0.1
  gamma_attenuation: 1.0
  attenuation: continuous
  calibration: warmup
  calibration_pool_epochs: 2
  radius_reference: fixed
graph:
  topology: complete
train:
  algo: dtropd
  total_epochs: 150
  num_envs: 40
  device: cpu
  seed: 0
