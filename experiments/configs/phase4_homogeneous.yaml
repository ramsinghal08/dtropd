# acceptance: ONE config, shared by every algorithm.
#
# SPEC Sec. 5 requires all baselines to train "with shared
# hyperparameters and identical seeds". Rather than trusting five near-identical
# YAML files to stay in sync, the acceptance harness runs this single file and
# overrides only `train.algo` (and `distill.enabled`, which is structural: the
# distillation algorithms refuse to run without it). Any hyperparameter is
# therefore shared by construction, not by inspection.
#
# SPEC Sec. 9 rule 5 / fair-tuning: no per-algorithm tuning has been performed.
# The values below are the IPPO settings, adopted unchanged by MAPPO,
# HAPPO, NaiveDistill and D-TrOPD.
notes: "baselines / homogeneous / shared hyperparameters"

env:
  n_agents: 12
  n_targets: 3
  capture_group_size: 3
  capture_radius: 0.3
  max_cycles: 50
  heterogeneous: false
  local_ratio: 0.5
  reward_spec_version: v1

network:
  hidden_sizes: [64, 64]
  activation: tanh
  log_std_init: -0.5

ppo:
  lr: 1.0e-3
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  entropy_coef: 0.0
  value_coef: 0.5
  max_grad_norm: 0.5
  inner_epochs: 4
  num_minibatches: 4
  kl_early_stop: 0.02

distill:
  enabled: false          # set per-algorithm by the harness
  beta_max: 0.05
  warmup_fraction: 0.1
  kappa: 100.0            # kappa * eta = 2.0
  delta_base: 0.1
  gamma_attenuation: 1.0
  attenuation: continuous
  calibration: warmup     # SPEC Sec. 10 / D1 (ignored by NaiveDistill)
  radius_reference: fixed

graph:
  topology: complete

train:
  algo: ippo
  total_epochs: 60
  num_envs: 40
  seed: 0
  device: cpu
  eval_interval: 60
  eval_episodes: 16
  log_dir: runs/phase4
